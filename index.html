<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac-Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3E7C6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mac-Coach">
<style>
  :root {
    --teal: #3E7C6F;
    --teal-dark: #2F6157;
    --amber: #E8A03C;
    --amber-soft: #FBF0DC;
    --ink: #2B2A26;
    --grey: #6B675E;
    --line: #E3DFD5;
    --paper: #FFFFFF;
    --bg: #FAF6EF;
    --green-soft: #E6F1EA;
    --red: #C94F3D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 21px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }

  h1 { font-size: 1.7rem; line-height: 1.2; }
  h2 { font-size: 1.45rem; line-height: 1.25; }
  p { margin-bottom: 0.7rem; }

  button {
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    border: none;
    border-radius: 14px;
  }
  button:active { transform: scale(0.98); }

  .btn-gross {
    display: block;
    width: 100%;
    padding: 1.05rem 1.2rem;
    background: var(--teal);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 600;
    border-radius: 16px;
    box-shadow: 0 3px 0 var(--teal-dark);
  }
  .btn-gross:hover { background: var(--teal-dark); }

  .btn-zart {
    display: block;
    width: 100%;
    padding: 0.85rem 1.2rem;
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--line);
    font-size: 1.02rem;
    font-weight: 500;
  }
  .btn-zart:hover { border-color: var(--teal); }

  /* Kleiner, unauffälliger Knopf – bewusst schmal, damit er nicht aus Versehen getroffen wird */
  .btn-mini {
    display: inline-block;
    width: auto;
    background: none;
    border: none;
    border-radius: 8px;
    padding: 0.35rem 0.5rem;
    color: var(--grey);
    font-size: 0.82rem;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .btn-mini:hover { color: var(--teal-dark); }
  .mini-zeile { text-align: center; margin-top: 0.9rem; }
  .einzel-aktionen { margin-top: 1.3rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .fertig-hinweis {
    margin-top: 1rem;
    background: #EAF1EE;
    border: 1px solid #CBDED7;
    border-radius: 14px;
    padding: 0.9rem 1rem;
    font-size: 0.95rem;
  }
  .fertig-hinweis strong { color: var(--teal-dark); }

  .kopf {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.1rem;
  }
  .kopf .logo { font-weight: 700; font-size: 1.05rem; color: var(--teal); }
  .kopf button { background: none; font-size: 1.2rem; padding: 0.3rem 0.5rem; }

  .karte-box {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 1.4rem 1.4rem 1.6rem;
    box-shadow: 0 2px 10px rgba(60, 50, 30, 0.06);
  }

  .chip {
    display: inline-block;
    background: var(--green-soft);
    color: var(--teal-dark);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.2rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 0.6rem;
  }

  .gfx {
    margin: 1rem 0;
    background: #FDFCF8;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0.6rem;
  }
  .gfx svg { display: block; width: 100%; height: auto; }

  .uebung {
    background: var(--amber-soft);
    border: 1.5px solid #EFD9B4;
    border-radius: 16px;
    padding: 1rem 1.1rem;
    margin: 1rem 0;
  }
  .uebung .u-titel {
    font-weight: 700;
    color: #8A5E14;
    margin-bottom: 0.35rem;
    font-size: 1.02rem;
  }
  .uebung p { margin-bottom: 0; }

  details.hilfe { margin: 0.8rem 0 0.4rem; }
  details.hilfe summary {
    cursor: pointer;
    color: var(--teal-dark);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.4rem 0;
    list-style-position: inside;
  }
  details.hilfe .hilfe-inhalt {
    background: var(--green-soft);
    border-radius: 12px;
    padding: 0.8rem 1rem;
    font-size: 0.95rem;
  }
  details.hilfe li { margin-left: 1.1rem; margin-bottom: 0.35rem; }

  .frage-zeile { margin-top: 0.9rem; text-align: center; }
  .frage-zeile button {
    background: none;
    color: var(--grey);
    font-size: 0.85rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .frage-zeile button.markiert { color: var(--teal-dark); font-weight: 600; text-decoration: none; }

  .bewertung {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.2rem;
  }
  .bewertung button {
    flex: 1;
    padding: 0.9rem 0.4rem;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.3;
    min-height: 88px;
  }
  .bewertung .emo { display: block; font-size: 1.7rem; margin-bottom: 0.25rem; }
  .b-nochmal { background: #FBEAE0; color: #8A4A14; border: 2px solid #EFC9A4; }
  .b-nochmal:hover { background: #F8DFC9; }
  .b-geht { background: #F1EEE6; color: var(--ink); border: 2px solid var(--line); }
  .b-geht:hover { background: #E9E5D9; }
  .b-kann { background: var(--teal); color: #fff; border: 2px solid var(--teal); box-shadow: 0 3px 0 var(--teal-dark); }
  .b-kann:hover { background: var(--teal-dark); }

  .fortschritt-leiste {
    height: 12px;
    background: #EDE8DC;
    border-radius: 999px;
    overflow: hidden;
    flex: 1;
  }
  .fortschritt-leiste > div {
    height: 100%;
    background: var(--teal);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .session-kopf {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin-bottom: 1rem;
  }
  .session-kopf .zaehler { font-size: 0.9rem; color: var(--grey); white-space: nowrap; font-weight: 600; }
  .session-kopf .pause { background: none; color: var(--grey); font-size: 0.9rem; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }

  .gruss { margin-bottom: 1.3rem; }
  .gruss .unter { color: var(--grey); font-size: 1.02rem; margin-top: 0.25rem; }
  .streak {
    display: inline-block;
    background: var(--amber-soft);
    color: #8A5E14;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 0.25rem 0.8rem;
    border-radius: 999px;
    margin-top: 0.6rem;
  }

  .themen-liste { margin-top: 1.6rem; }
  .themen-liste h3 { font-size: 1.02rem; color: var(--grey); font-weight: 600; margin-bottom: 0.7rem; }
  .thema-zeile {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0.8rem 1rem;
    margin-bottom: 0.6rem;
    width: 100%;
    text-align: left;
    font-size: 1rem;
  }
  .thema-zeile:hover { border-color: var(--teal); }
  .thema-zeile .t-emoji { font-size: 1.5rem; }
  .thema-zeile .t-name { font-weight: 600; flex: 1; }
  .thema-zeile .t-stand { font-size: 0.82rem; color: var(--grey); text-align: right; }
  .thema-zeile .t-lernen { color: var(--teal); font-weight: 600; }
  .thema-zeile .mini-balken { display: flex; width: 100%; height: 7px; background: #EDE8DC; border-radius: 999px; margin-top: 0.3rem; overflow: hidden; }
  .thema-zeile .mini-balken > div { height: 100%; background: var(--teal); }
  .thema-zeile .mini-balken > .ml-lernen { background: #A8CFC5; }
  .thema-zeile .t-mitte { flex: 1; }

  .karten-liste button {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: 100%;
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    font-size: 1rem;
  }
  .karten-liste button:hover { border-color: var(--teal); }
  .karten-liste .status { font-size: 0.78rem; color: var(--grey); margin-left: auto; white-space: nowrap; }
  .status.s-sicher { color: var(--teal-dark); font-weight: 600; }
  .status.s-neu { color: #A08A50; }

  .fertig-box { text-align: center; padding: 2.5rem 1rem; }
  .fertig-box .gross-emoji { font-size: 4rem; margin-bottom: 0.8rem; }
  .fertig-box p { color: var(--grey); }

  .zurueck-leiste { margin-bottom: 1rem; }
  .zurueck-leiste button {
    background: none;
    color: var(--teal-dark);
    font-weight: 600;
    font-size: 1rem;
    padding: 0.3rem 0;
  }

  .einstellungen label { display: block; font-weight: 600; margin: 1.1rem 0 0.3rem; font-size: 0.95rem; }
  .einstellungen input[type="text"], .einstellungen select {
    font-family: inherit;
    font-size: 1.05rem;
    padding: 0.6rem 0.8rem;
    border: 2px solid var(--line);
    border-radius: 12px;
    width: 100%;
    background: var(--paper);
    color: var(--ink);
  }
  .einstellungen .klein { font-size: 0.85rem; color: var(--grey); margin-top: 0.2rem; }
  .einstellungen .block { margin-top: 1.4rem; }
  .fragen-liste li { margin-left: 1.2rem; margin-bottom: 0.3rem; }

  .fuss {
    margin-top: 2.5rem;
    text-align: center;
    font-size: 0.8rem;
    color: #B0AB9F;
  }

  .neu-banner {
    background: #FFF8E8;
    border: 1.5px solid #EFD9B4;
    border-radius: 16px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 1.1rem;
  }
  .neu-banner .nb-titel { font-weight: 700; color: #8A5E14; margin-bottom: 0.2rem; }
  .neu-banner p { margin: 0; font-size: 0.95rem; }
  .neu-banner button {
    margin-top: 0.7rem;
    background: none;
    color: var(--teal-dark);
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 0.2rem 0;
  }

  /* Spiel-Übungen */
  .spiel-anweisung { margin-bottom: 0; font-weight: 500; }
  .spiel-buehne {
    position: relative;
    background: #fff;
    border: 2px dashed #D8D2C2;
    border-radius: 14px;
    margin-top: 0.7rem;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overflow: hidden;
  }
  .geschafft { pointer-events: none; opacity: 0.8; }
  .spiel-geschafft {
    margin-top: 0.7rem;
    background: var(--teal);
    color: #fff;
    border-radius: 16px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    text-align: center;
    padding: 1.2rem;
    animation: sg-auf 0.45s ease;
  }
  .spiel-geschafft .sg-haken {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: #fff;
    color: var(--teal-dark);
    font-size: 2.3rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: sg-pop 0.55s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .spiel-geschafft .sg-text { font-size: 1.2rem; font-weight: 700; }
  @keyframes sg-auf { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes sg-pop { 0% { transform: scale(0); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .spiel-feedback[hidden] { display: none; }
  .spiel-feedback {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.7rem;
    background: #FFF;
    border: 1.5px solid #EFD9B4;
    border-radius: 12px;
    padding: 0.6rem 0.9rem;
    font-size: 0.95rem;
    color: #7A5210;
  }
  .spiel-erfolg {
    background: var(--green-soft);
    border: 1.5px solid #C9E0D2;
    border-radius: 16px;
    padding: 1.1rem 1.2rem;
    margin-top: 1rem;
    text-align: center;
  }
  .spiel-erfolg .se-titel { font-size: 1.25rem; font-weight: 700; color: var(--teal-dark); }
  .spiel-erfolg .btn-gross { margin-top: 0.9rem; }
  .spiel-erfolg .leise {
    display: block;
    margin: 0.7rem auto 0;
    background: none;
    color: var(--grey);
    font-size: 0.85rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .echt-box {
    background: var(--amber-soft);
    border: 1.5px solid #EFD9B4;
    border-radius: 12px;
    padding: 0.8rem 1rem;
    margin-top: 0.9rem;
    text-align: left;
    font-size: 0.98rem;
  }
  .echt-knoepfe { display: flex; gap: 0.6rem; margin-top: 0.9rem; }
  .echt-knoepfe button {
    flex: 1;
    padding: 0.8rem 0.5rem;
    border-radius: 14px;
    font-weight: 600;
    font-size: 0.95rem;
    min-height: 64px;
    line-height: 1.3;
  }
  .k-sub { display: block; font-weight: 500; font-size: 0.78rem; opacity: 0.85; margin-top: 0.25rem; }

  /* Wiederholungs-Rhythmus sichtbar machen */
  .sr-box {
    background: #fff;
    border: 1.5px solid #C9E0D2;
    border-radius: 14px;
    padding: 0.85rem 1rem;
    margin-top: 0.9rem;
    text-align: left;
  }
  .sr-titel { font-size: 0.88rem; font-weight: 700; color: var(--teal-dark); margin-bottom: 0.5rem; }
  .sr-titel .sr-wann { color: var(--ink); }
  .rhythmus { display: flex; align-items: center; flex-wrap: wrap; gap: 0.28rem; }
  .r-pille {
    min-width: 30px;
    text-align: center;
    padding: 0.2rem 0.35rem;
    border-radius: 8px;
    background: #F1EEE6;
    color: #9C978C;
    font-size: 0.82rem;
    font-weight: 700;
  }
  .r-pille.r-fertig { background: var(--green-soft); color: var(--teal-dark); }
  .r-pille.r-jetzt {
    background: var(--teal);
    color: #fff;
    box-shadow: 0 0 0 3px rgba(62, 124, 111, 0.18);
  }
  .r-tr { color: #CFCAC0; font-size: 0.75rem; }
  .r-einheit { font-size: 0.78rem; color: var(--grey); margin-left: 0.25rem; }
  .sr-erklaerung { font-size: 0.85rem; color: var(--grey); margin: 0.5rem 0 0; }
  .sr-hinweis {
    font-size: 0.82rem;
    color: var(--grey);
    text-align: center;
    margin-top: 0.7rem;
    line-height: 1.45;
  }
  .ziel-feld {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green-soft);
    border: 2.5px solid var(--teal);
    color: var(--teal-dark);
    font-weight: 700;
    border-radius: 16px;
    overflow: hidden;
  }
  .ziel-feld .fuell {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 0%;
    background: var(--teal);
    opacity: 0.25;
    transition: height 0.7s linear;
  }
  .spiel-knopf {
    position: absolute;
    background: var(--teal);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 0.85rem 1.5rem;
    border-radius: 14px;
    box-shadow: 0 3px 0 var(--teal-dark);
  }
  .spiel-objekt { position: absolute; text-align: center; width: 78px; cursor: grab; }
  .spiel-objekt .obj-bild { font-size: 2.4rem; line-height: 1.15; }
  .spiel-objekt .obj-name { font-size: 0.78rem; color: var(--ink); background: rgba(255,255,255,0.85); border-radius: 6px; }
  .spiel-objekt.gewaehlt .obj-name { background: #BFD7EA; }
  .obj-eingabe {
    width: 76px;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1.5px solid var(--teal);
    border-radius: 5px;
    text-align: center;
    user-select: text;
    -webkit-user-select: text;
  }
  .spiel-ziel { position: absolute; text-align: center; width: 92px; border-radius: 12px; padding: 4px 0; }
  .spiel-ziel.heiss { background: #CFE3D6; }
  .fake-menu {
    position: absolute;
    z-index: 5;
    background: #F9F8F4;
    border: 1px solid #D5D0C3;
    border-radius: 10px;
    box-shadow: 0 8px 22px rgba(40,35,20,0.18);
    padding: 4px;
    min-width: 172px;
    font-size: 0.9rem;
  }
  .fake-menu div { padding: 0.35rem 0.7rem; border-radius: 6px; cursor: pointer; }
  .fake-menu div:hover { background: var(--teal); color: #fff; }
  .ff {
    border: 1.5px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    margin-top: 0.7rem;
    background: #fff;
    user-select: none;
    -webkit-user-select: none;
  }
  .ff-titel {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: #F1EEE6;
    padding: 0.45rem 0.7rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--grey);
  }
  .ampel { display: flex; gap: 5px; }
  .ampel span { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .ff-body { display: flex; min-height: 215px; }
  .ff-seite {
    width: 106px;
    flex-shrink: 0;
    background: #F5F2EA;
    padding: 0.5rem;
    font-size: 0.78rem;
    color: var(--grey);
    line-height: 1.5;
  }
  .ff-aktiv { background: #DCE7DE; border-radius: 5px; padding: 2px 4px; color: var(--teal-dark); font-weight: 700; }
  .ff-main { flex: 1; position: relative; touch-action: none; }
  .brief-box {
    height: 195px;
    overflow-y: auto;
    margin-top: 0.7rem;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    background: #fff;
    font-size: 0.95rem;
  }

  /* SVG-Animationen */
  @keyframes puls {
    0% { r: 14; opacity: 0.9; }
    70% { r: 26; opacity: 0; }
    100% { r: 26; opacity: 0; }
  }
  svg .ring { animation: puls 1.6s ease-out infinite; }
  @keyframes wippen {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  svg .wipp { animation: wippen 1.5s ease-in-out infinite; }

  @media (max-width: 480px) {
    html { font-size: 19px; }
    .bewertung { flex-direction: column; }
    .bewertung button { min-height: 64px; }
    .echt-knoepfe { flex-direction: column; }
    .echt-knoepfe button { min-height: 56px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   Farben für die Grafiken
   ============================================================ */
const F = {
  teal: "#3E7C6F", tealDark: "#2F6157", amber: "#E8A03C",
  ink: "#2B2A26", grau: "#8A867C", linie: "#D8D5CC",
  papier: "#FFFFFF", screen: "#EAF3F6", korpus: "#D9D5CC",
  tasten: "#CFCBC2", pad: "#F8F6F1",
  rot: "#E25C4A", gelb: "#E8B93C", gruen: "#5FA860",
  blau: "#4A7FC1", himmel: "#DCEBF2"
};

/* ============================================================
   Grafik-Bausteine (SVG)
   ============================================================ */
function sv(inner, hoehe = 250) {
  return `<svg viewBox="0 0 440 ${hoehe}" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
}

function finger(x, y, mitRing = true) {
  return `${mitRing ? `<circle class="ring" cx="${x}" cy="${y}" r="14" fill="none" stroke="${F.teal}" stroke-width="3"/>` : ""}
    <circle cx="${x}" cy="${y}" r="13" fill="${F.teal}" opacity="0.9"/>
    <circle cx="${x - 4}" cy="${y - 4}" r="4" fill="#fff" opacity="0.35"/>`;
}

function pfeil(x1, y1, x2, y2, farbe = F.amber, dicke = 4) {
  const wk = Math.atan2(y2 - y1, x2 - x1);
  const l = 11;
  const p1x = x2 - l * Math.cos(wk - 0.45), p1y = y2 - l * Math.sin(wk - 0.45);
  const p2x = x2 - l * Math.cos(wk + 0.45), p2y = y2 - l * Math.sin(wk + 0.45);
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${farbe}" stroke-width="${dicke}" stroke-linecap="round"/>
    <path d="M${x2},${y2} L${p1x},${p1y} L${p2x},${p2y} Z" fill="${farbe}"/>`;
}

function tastatur(x, y, b, h) {
  let keys = "";
  const reihen = 3, spalten = 10;
  const kb = b / spalten, kh = h / reihen;
  for (let r = 0; r < reihen; r++)
    for (let s = 0; s < spalten; s++)
      keys += `<rect x="${x + s * kb + 2}" y="${y + r * kh + 2}" width="${kb - 4}" height="${kh - 4}" rx="3" fill="#C2BDB2"/>`;
  return keys;
}

function dock(x, y, breite = 250, hervor = -1, punktBei = -1) {
  const apps = [
    { f1: "#4A9BD8", f2: "#E8F2FA", art: "finder" },
    { f1: "#EA4335", f2: "#FBBC05", art: "chrome" },
    { f1: "#1E73E8", f2: "#7FB2F0", art: "mail" },
    { f1: "#E8A03C", f2: "#F5D9A8", art: "fotos" },
    { f1: "#8A867C", f2: "#C4C0B6", art: "zahnrad" }
  ];
  const g = 34, abst = (breite - 60) / apps.length;
  let out = `<rect x="${x}" y="${y}" width="${breite}" height="46" rx="12" fill="#F2EFE8" stroke="${F.linie}" stroke-width="1.5" opacity="0.95"/>`;
  apps.forEach((a, i) => {
    const ax = x + 12 + i * abst;
    const ay = y + 6;
    const ring = i === hervor ? `<rect x="${ax - 4}" y="${ay - 4}" width="${g + 8}" height="${g + 8}" rx="10" fill="none" stroke="${F.amber}" stroke-width="3.5"/>` : "";
    let symbol = "";
    if (a.art === "finder") symbol = `<rect x="${ax}" y="${ay}" width="${g}" height="${g}" rx="8" fill="${a.f2}"/><rect x="${ax}" y="${ay}" width="${g / 2}" height="${g}" rx="8" fill="${a.f1}"/><circle cx="${ax + 10}" cy="${ay + 14}" r="2.5" fill="${F.ink}"/><circle cx="${ax + 24}" cy="${ay + 14}" r="2.5" fill="${F.ink}"/><path d="M${ax + 8},${ay + 23} Q${ax + 17},${ay + 30} ${ax + 26},${ay + 23}" stroke="${F.ink}" stroke-width="2" fill="none"/>`;
    else if (a.art === "chrome") symbol = `<circle cx="${ax + g / 2}" cy="${ay + g / 2}" r="${g / 2}" fill="#fff"/><circle cx="${ax + g / 2}" cy="${ay + g / 2}" r="${g / 2}" fill="none" stroke="#DADCE0" stroke-width="1"/><path d="M${ax + g / 2},${ay + g / 2} m-15,0 a15,15 0 0 1 26,-7.5 l-11,7.5 z" fill="#EA4335"/><path d="M${ax + g / 2},${ay + g / 2} m11,-7.5 a15,15 0 0 1 -4,22 l-7,-14.5 z" fill="#FBBC05"/><path d="M${ax + g / 2},${ay + g / 2} m7,14.5 a15,15 0 0 1 -22,-7 l15,-7.5 z" fill="#34A853"/><circle cx="${ax + g / 2}" cy="${ay + g / 2}" r="6.5" fill="#4285F4" stroke="#fff" stroke-width="2"/>`;
    else if (a.art === "mail") symbol = `<rect x="${ax}" y="${ay}" width="${g}" height="${g}" rx="8" fill="${a.f1}"/><rect x="${ax + 6}" y="${ay + 10}" width="22" height="15" rx="2" fill="#fff"/><path d="M${ax + 6},${ay + 11} L${ax + 17},${ay + 19} L${ax + 28},${ay + 11}" stroke="${a.f1}" stroke-width="1.8" fill="none"/>`;
    else if (a.art === "fotos") symbol = `<rect x="${ax}" y="${ay}" width="${g}" height="${g}" rx="8" fill="#fff" stroke="${F.linie}"/><circle cx="${ax + 17}" cy="${ay + 12}" r="5" fill="#F6C445"/><circle cx="${ax + 23}" cy="${ay + 17}" r="5" fill="#EA6A5A"/><circle cx="${ax + 17}" cy="${ay + 23}" r="5" fill="#4A9BD8"/><circle cx="${ax + 11}" cy="${ay + 17}" r="5" fill="#69B76B"/>`;
    else symbol = `<rect x="${ax}" y="${ay}" width="${g}" height="${g}" rx="8" fill="${a.f2}"/><circle cx="${ax + g / 2}" cy="${ay + g / 2}" r="9" fill="none" stroke="#5F5B52" stroke-width="3" stroke-dasharray="4 3"/><circle cx="${ax + g / 2}" cy="${ay + g / 2}" r="3.5" fill="#5F5B52"/>`;
    const punkt = i === punktBei ? `<circle cx="${ax + g / 2}" cy="${y + 44}" r="2.6" fill="${F.ink}"/>` : "";
    out += ring + symbol + punkt;
  });
  return out;
}

function zoomLeiste(x, y, b, hervor = "", tonAus = false, bildAus = false) {
  const mx = x + 42, vx = x + 116, lx = x + b - 86;
  const strich = cx => `<line x1="${cx - 14}" y1="${y + 7}" x2="${cx + 14}" y2="${y + 31}" stroke="${F.rot}" stroke-width="3.5" stroke-linecap="round"/>`;
  const markiert = (cx, w) => `<rect x="${cx - w / 2}" y="${y + 2}" width="${w}" height="38" rx="9" fill="none" stroke="${F.amber}" stroke-width="3"/>`;
  return `<rect x="${x}" y="${y}" width="${b}" height="42" rx="10" fill="#1F2B33"/>
    <rect x="${mx - 4}" y="${y + 8}" width="8" height="13" rx="4" fill="#fff"/>
    <path d="M${mx - 7},${y + 20} a7,7 0 0 0 14,0" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="${mx}" y1="${y + 26}" x2="${mx}" y2="${y + 29}" stroke="#fff" stroke-width="2"/>
    <text x="${mx}" y="${y + 39}" text-anchor="middle" font-size="9" fill="#C8D2D8">Ton</text>
    ${tonAus ? strich(mx) : ""}
    <rect x="${vx - 14}" y="${y + 11}" width="20" height="15" rx="3" fill="#fff"/>
    <path d="M${vx + 7},${y + 18.5} L${vx + 16},${y + 12} L${vx + 16},${y + 25} Z" fill="#fff"/>
    <text x="${vx}" y="${y + 39}" text-anchor="middle" font-size="9" fill="#C8D2D8">Bild</text>
    ${bildAus ? strich(vx) : ""}
    <rect x="${lx}" y="${y + 9}" width="74" height="24" rx="12" fill="${F.rot}"/>
    <text x="${lx + 37}" y="${y + 26}" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Verlassen</text>
    ${hervor === "ton" ? markiert(mx, 56) : ""}
    ${hervor === "bild" ? markiert(vx, 56) : ""}
    ${hervor === "verlassen" ? markiert(lx + 37, 86) : ""}`;
}

/* ============================================================
   Interaktive Spiel-Übungen
   ============================================================ */
function ueberlappt(a, b) {
  const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const cx = ra.left + ra.width / 2, cy = ra.top + ra.height / 2;
  return cx > rb.left && cx < rb.right && cy > rb.top && cy < rb.bottom;
}

/* Festhalten-und-Ziehen für Objekt → Zielzone */
function machZiehbar(buehne, objekt, ziel, api, opt) {
  const startPos = { left: objekt.offsetLeft, top: objekt.offsetTop };
  let start = null;
  objekt.style.touchAction = "none";
  objekt.addEventListener("pointerdown", e => {
    e.preventDefault();
    objekt.setPointerCapture(e.pointerId);
    start = { x: e.clientX, y: e.clientY, left: objekt.offsetLeft, top: objekt.offsetTop };
    objekt.style.cursor = "grabbing";
  });
  objekt.addEventListener("pointermove", e => {
    if (!start) return;
    const l = Math.max(0, Math.min(start.left + (e.clientX - start.x), buehne.clientWidth - objekt.offsetWidth));
    const t = Math.max(0, Math.min(start.top + (e.clientY - start.y), buehne.clientHeight - objekt.offsetHeight));
    objekt.style.left = l + "px";
    objekt.style.top = t + "px";
    ziel.classList.toggle("heiss", ueberlappt(objekt, ziel));
  });
  objekt.addEventListener("pointerup", e => {
    if (!start) return;
    const bewegt = Math.hypot(e.clientX - start.x, e.clientY - start.y) > 12;
    start = null;
    objekt.style.cursor = "grab";
    if (ueberlappt(objekt, ziel)) {
      ziel.classList.remove("heiss");
      opt.inZiel(objekt, ziel);
      api.erfolg(opt.erfolgText);
    } else if (bewegt) {
      objekt.style.left = startPos.left + "px";
      objekt.style.top = startPos.top + "px";
      api.fehler("Fast! Du hast zu früh losgelassen. Halte gedrückt, bis du über dem Ziel bist, und lass erst DANN los.");
    } else {
      api.fehler("Nur gedrückt, aber nicht gezogen. Drücken, HALTEN und dabei mit dem Finger streichen, dann wandert es mit.");
    }
  });
}

function fakeMenue(main, e, inhaltHTML) {
  const m = document.createElement("div");
  m.className = "fake-menu";
  m.innerHTML = inhaltHTML;
  const r = main.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(e.clientX - r.left, r.width - 185)) + "px";
  m.style.top = Math.max(4, Math.min(e.clientY - r.top, r.height - 170)) + "px";
  main.appendChild(m);
  return m;
}

/* Steuert eine Spiel-Übung auf einer Karte.
   opts: { modus: "lernen"|"ansehen", wiederholung: bool, weiter(urteil) } */
function starteUebung(karte, opts) {
  const def = UEBUNGEN[karte.interaktiv];
  const host = document.getElementById("spielhost");
  const feedback = document.getElementById("spielfeedback");
  const ausgang = document.getElementById("spielausgang");
  document.getElementById("spielanweisung").textContent = def.anweisung;
  let fehlversuche = 0, fertig = false, ausstiegGezeigt = false;

  function zeigeMeldung(text) {
    feedback.hidden = false;
    feedback.innerHTML = `<span>💬</span><span>${text}</span>`;
  }

  const api = {
    tipp(text) { if (!fertig) zeigeMeldung(text); },
    fehler(text) {
      if (fertig) return;
      fehlversuche++;
      zeigeMeldung(text);
      if (fehlversuche === 2) {
        const det = document.querySelector("details.hilfe");
        if (det) det.open = true;
      }
      if (fehlversuche >= 4 && opts.modus === "lernen" && !ausstiegGezeigt) {
        ausstiegGezeigt = true;
        ausgang.innerHTML = `<div class="spiel-erfolg" style="background:#F6F3EA; border-color:var(--line)">
          <div class="se-titel" style="color:var(--ink)">Macht überhaupt nichts! 💛</div>
          <p style="margin:0.4rem 0 0">Die Übung ist knifflig. Du kannst gern weiterprobieren, oder sie kommt morgen einfach nochmal, ganz in Ruhe.</p>
          <button class="btn-gross" data-akt="morgen">Weiter – morgen nochmal</button>
        </div>`;
        ausgang.querySelector('[data-akt="morgen"]').onclick = () => opts.weiter("morgen");
      }
    },
    erfolg(text) {
      if (fertig) return;
      fertig = true;
      feedback.hidden = true;
      host.innerHTML = `<div class="spiel-geschafft">
        <div class="sg-haken">✓</div>
        <div class="sg-text">Perfekt – das hat geklappt!</div>
      </div>`;
      if (opts.modus === "ansehen") {
        ausgang.innerHTML = `<div class="spiel-erfolg"><div class="se-titel">🌟 Geschafft!</div><p style="margin:0.3rem 0 0">${text}</p></div>`;
      } else if (opts.wiederholung) {
        const v = vorschau(karte.id, "kann");
        ausgang.innerHTML = `<div class="spiel-erfolg">
          <div class="se-titel">🌟 Geschafft!</div>
          <p style="margin:0.3rem 0 0">${text}</p>
          <div class="echt-box"><strong>Und jetzt in echt, auf deinem Mac:</strong><br>${karte.uebung}</div>
          <div class="echt-knoepfe">
            <button class="b-kann" data-akt="kann">✓ Hat am Mac geklappt<span class="k-sub">dann erst ${abstandText(v.tage)} wieder</span></button>
            <button class="b-geht" data-akt="geht">Am Mac klappt's noch nicht<span class="k-sub">dann morgen nochmal</span></button>
          </div>
          ${srBox(karte.id, false)}
        </div>`;
        ausgang.querySelector('[data-akt="kann"]').onclick = () => opts.weiter("kann");
        ausgang.querySelector('[data-akt="geht"]').onclick = () => opts.weiter("geht");
      } else {
        ausgang.innerHTML = `<div class="spiel-erfolg">
          <div class="se-titel">🌟 Geschafft!</div>
          <p style="margin:0.3rem 0 0">${text}</p>
          ${srBox(karte.id)}
          <button class="btn-gross" data-akt="kann">Weiter</button>
          <button class="leise" data-akt="geht">Ich bin unsicher – morgen nochmal zeigen</button>
        </div>`;
        ausgang.querySelector('[data-akt="kann"]').onclick = () => opts.weiter("kann");
        ausgang.querySelector('[data-akt="geht"]').onclick = () => opts.weiter("geht");
      }
      ausgang.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  };
  def.bau(host, api);
}

/* ============================================================
   Spaced Repetition
   ============================================================ */
/* Version dieser App-Datei. Muss zur "version" in version.json passen –
   sonst holt sich die App beim Start automatisch die neue Fassung. */
const VERSION = "2.6.0";

/* Abstand nach der n-ten geschafften Wiederholung: Stufe 1 → morgen, Stufe 2 → 2 Tage, … */
const PLAN_TAGE = [1, 2, 4, 7, 14, 30, 60];
const MAX_STUFE = PLAN_TAGE.length;
const SPEICHER_SCHLUESSEL = "macCoachDaten";

function abstandFuer(stufe) {
  return PLAN_TAGE[Math.max(1, Math.min(stufe, MAX_STUFE)) - 1];
}
function abstandText(tage) {
  if (tage <= 1) return "morgen";
  if (tage === 7) return "in einer Woche";
  if (tage === 14) return "in zwei Wochen";
  if (tage === 30) return "in einem Monat";
  if (tage === 60) return "in zwei Monaten";
  return `in ${tage} Tagen`;
}
/* Was passiert bei diesem Urteil? (Vorschau, ohne zu speichern) */
function vorschau(kartenId, urteil) {
  const k = daten.karten[kartenId];
  const stufe = k ? k.stufe : 0;
  if (urteil !== "kann") return { stufe: 1, tage: 1 };
  const neu = Math.min(stufe + 1, MAX_STUFE);
  return { stufe: neu, tage: abstandFuer(neu) };
}
function rhythmusLeiste(zielStufe) {
  const pillen = PLAN_TAGE.map((t, i) => {
    const nr = i + 1;
    const klasse = nr < zielStufe ? "r-fertig" : nr === zielStufe ? "r-jetzt" : "";
    return `<span class="r-pille ${klasse}">${t}</span>`;
  }).join('<span class="r-tr">›</span>');
  return `<div class="rhythmus">${pillen}<span class="r-einheit">Tage Abstand</span></div>`;
}
/* Erklär-Kasten: wann kommt die Karte wieder und warum wächst der Abstand.
   mitWann=false, wenn der Termin schon auf den Knöpfen steht (keine Dopplung). */
function srBox(kartenId, mitWann = true) {
  const v = vorschau(kartenId, "kann");
  const kopf = mitWann
    ? `🔁 Wiederholung: <span class="sr-wann">Diese Übung kommt ${abstandText(v.tage)} wieder.</span>`
    : `🔁 Dein Rhythmus bei dieser Übung`;
  const erklaerung = v.stufe < MAX_STUFE
    ? `Klappt sie dann wieder, wächst der Abstand jedes Mal weiter – bis sie ganz sicher sitzt.`
    : `Diese Übung sitzt jetzt sicher. Sie kommt nur noch selten zur Auffrischung.`;
  return `<div class="sr-box">
    <div class="sr-titel">${kopf}</div>
    ${rhythmusLeiste(v.stufe)}
    <p class="sr-erklaerung">${erklaerung}</p>
  </div>`;
}

function heuteISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function tagePlus(iso, tage) {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + tage);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

let daten = ladeDaten();
function ladeDaten() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (roh) {
      const d = JSON.parse(roh);
      d.karten = d.karten || {};
      d.tage = d.tage || [];
      d.fragen = d.fragen || [];
      return d;
    }
  } catch (e) { /* kaputte Daten → frisch anfangen */ }
  return { version: 1, name: "", neuProTag: 3, karten: {}, tage: [], fragen: [], gesehenVersion: "" };
}
function speichern() {
  try { localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten)); } catch (e) {}
}

function kartenStatus(id) {
  const k = daten.karten[id];
  if (!k) return "neu";
  if (k.stufe >= 4) return "sicher";
  return "lernen";
}
function statusText(s) {
  return s === "neu" ? "✨ neu" : s === "sicher" ? "✓ sitzt" : "🌱 am Lernen";
}

/* Heutige Lernrunde zusammenstellen */
function baueRunde() {
  const heute = heuteISO();
  const faellig = KARTEN.filter(k => {
    const d = daten.karten[k.id];
    return d && d.faellig <= heute;
  });
  const heuteSchonNeu = KARTEN.filter(k => daten.karten[k.id] && daten.karten[k.id].start === heute).length;
  const neue = KARTEN.filter(k => !daten.karten[k.id]).slice(0, Math.max(0, daten.neuProTag - heuteSchonNeu));
  return [...faellig, ...neue].slice(0, 12);
}

function bewerte(id, urteil) {
  const heute = heuteISO();
  let k = daten.karten[id] || { stufe: 0, faellig: heute, gesehen: 0, start: heute };
  k.gesehen = (k.gesehen || 0) + 1;
  if (urteil === "nochmal") {
    k.stufe = 0;
    k.faellig = heute;
  } else if (urteil === "geht") {
    k.stufe = Math.max(0, Math.min(k.stufe, 1));
    k.faellig = tagePlus(heute, 1);
  } else if (urteil === "morgen") {
    k.stufe = 0;
    k.faellig = tagePlus(heute, 1);
  } else {
    k.stufe = Math.min(k.stufe + 1, MAX_STUFE);
    k.faellig = tagePlus(heute, abstandFuer(k.stufe));
  }
  daten.karten[id] = k;
  speichern();
}

/* „Das kann ich schon“: Karte auf die höchste Stufe setzen, damit sie im
   täglichen Rhythmus praktisch nicht mehr auftaucht (nur noch zur Auffrischung). */
function alsKannMarkieren(id) {
  const heute = heuteISO();
  const k = daten.karten[id] || { stufe: 0, gesehen: 0, start: heute };
  k.stufe = MAX_STUFE;
  k.faellig = tagePlus(heute, abstandFuer(MAX_STUFE));
  k.uebersprungen = true;
  daten.karten[id] = k;
  speichern();
}
/* Rückgängig: Karte kommt wieder ganz normal in den Rhythmus. */
function wiederAufnehmen(id) {
  const heute = heuteISO();
  const k = daten.karten[id] || { stufe: 0, gesehen: 0, start: heute };
  k.stufe = 0;
  k.faellig = heute;
  k.uebersprungen = false;
  daten.karten[id] = k;
  speichern();
}

function streakZaehlen() {
  const tage = [...new Set(daten.tage)].sort().reverse();
  if (!tage.length) return 0;
  let s = 0, erwartet = heuteISO();
  if (tage[0] !== erwartet) erwartet = tagePlus(erwartet, -1);
  for (const t of tage) {
    if (t === erwartet) { s++; erwartet = tagePlus(erwartet, -1); }
    else break;
  }
  return s;
}

const app = document.getElementById("app");
let runde = [];
let rundePos = 0;
let rundeGesamt = 0;
let aufStartseite = false;
let neuHinweis = "";
/* Wohin es nach „Pause“ und nach der letzten Karte zurückgeht.
   Bei der Tagesrunde die Startseite, bei einer Themenrunde das Thema. */
let rundeZurueck = zeigeStart;
let rundeTitel = "";

/* Startet eine Übungsrunde mit einer festen Kartenliste. */
function starteRunde(karten, zurueck, titel = "") {
  runde = karten.slice();
  rundePos = 0;
  rundeGesamt = runde.length;
  rundeZurueck = zurueck;
  rundeTitel = titel;
  zeigeKarte();
}

/* Holt version.json und lädt die App einmal neu, wenn eine neuere Fassung
   veröffentlicht wurde. Ohne Internet passiert einfach nichts. */
async function pruefeUpdate() {
  let info;
  try {
    const antwort = await fetch("version.json?t=" + new Date().getTime(), { cache: "no-store" });
    if (!antwort.ok) return;
    info = await antwort.json();
  } catch (e) {
    return;   // offline oder als lokale Datei geöffnet – kein Problem
  }
  if (!info || !info.version) return;

  if (info.version !== VERSION) {
    const marke = "macCoachNeuladen:" + info.version;
    if (!sessionStorage.getItem(marke)) {
      sessionStorage.setItem(marke, "1");   // schützt vor Neulade-Schleife
      location.replace(location.pathname + "?v=" + encodeURIComponent(info.version));
    }
    return;
  }
  // Hinweis nur für jemanden, der schon geübt hat – beim ersten Start ist nichts "neu"
  if (info.neu && daten.gesehenVersion !== info.version && (daten.tage || []).length > 0) {
    neuHinweis = String(info.neu);
    if (aufStartseite) zeigeStart();
  }
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function zeigeStart() {
  aufStartseite = true;
  const stunde = new Date().getHours();
  const gruss = stunde < 11 ? "Guten Morgen" : stunde < 18 ? "Guten Tag" : "Guten Abend";
  const name = daten.name ? `, ${esc(daten.name)}` : "";
  const anstehend = baueRunde();
  const streak = streakZaehlen();

  const themenHTML = THEMEN.map(t => {
    const karten = KARTEN.filter(k => k.thema === t.id);
    const sicher = karten.filter(k => kartenStatus(k.id) === "sicher").length;
    const lernen = karten.filter(k => kartenStatus(k.id) === "lernen").length;
    /* Angefangene Karten zählen halb – so bewegt sich der Balken schon ab der ersten Übung. */
    const pctSicher = Math.round((sicher / karten.length) * 100);
    const pctLernen = Math.round((lernen / karten.length) * 50);
    const stand = sicher === 0 && lernen === 0
      ? `${karten.length} Übungen<br>noch nicht<br>angefangen`
      : `${sicher} von ${karten.length}<br>sitzen${lernen ? `<br><span class="t-lernen">🌱 ${lernen} am Lernen</span>` : ""}`;
    return `<button class="thema-zeile" data-thema="${t.id}">
      <span class="t-emoji">${t.emoji}</span>
      <span class="t-mitte">
        <span class="t-name">${t.name}</span>
        <span class="mini-balken"><div style="width:${pctSicher}%"></div><div class="ml-lernen" style="width:${pctLernen}%"></div></span>
      </span>
      <span class="t-stand">${stand}</span>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="kopf">
      <span class="logo">🧭 Mac-Coach</span>
      <button data-akt="einstellungen" title="Einstellungen">⚙️</button>
    </div>
    <div class="gruss">
      <h1>${gruss}${name}! ☀️</h1>
      <div class="unter">Schön, dass du da bist.</div>
      ${streak >= 2 ? `<div class="streak">🔥 ${streak} Tage hintereinander geübt!</div>` : ""}
    </div>
    ${anstehend.length
      ? `<button class="btn-gross" data-akt="start">▶ &nbsp;Jetzt üben &nbsp;·&nbsp; ${anstehend.length} ${anstehend.length === 1 ? "Karte" : "Karten"}</button>`
      : `<div class="karte-box" style="text-align:center">
           <div style="font-size:2.2rem">🎉</div>
           <p style="margin:0.4rem 0 0"><strong>Für heute ist alles erledigt!</strong></p>
           <p style="color:var(--grey); margin:0.3rem 0 0">Komm morgen einfach wieder – dann warten die nächsten Wiederholungen auf dich.</p>
           <p style="color:var(--grey); margin:0.6rem 0 0">Du magst noch mehr? Tippe unten ein Thema an – dort kannst du es jederzeit zusätzlich üben.</p>
         </div>`}
    ${neuHinweis ? `<div class="neu-banner">
      <div class="nb-titel">✨ Es ist etwas Neues dazugekommen</div>
      <p>${esc(neuHinweis)}</p>
      <button data-akt="neu-ok">Alles klar, danke</button>
    </div>` : ""}
    <div class="themen-liste">
      <h3>Zum Nachschauen: alle Themen</h3>
      <p style="color:var(--grey); font-size:0.85rem; margin:-0.4rem 0 0.7rem">🌱 am Lernen = schon geübt. „Sitzt“ wird eine Übung, wenn sie an mehreren Tagen geklappt hat.</p>
      ${themenHTML}
    </div>
    <div class="fuss">Mac-Coach · Version ${VERSION}</div>`;

  const neuOk = app.querySelector('[data-akt="neu-ok"]');
  if (neuOk) neuOk.onclick = () => {
    daten.gesehenVersion = VERSION;
    speichern();
    neuHinweis = "";
    zeigeStart();
  };
  app.querySelector('[data-akt="einstellungen"]').onclick = zeigeEinstellungen;
  const startBtn = app.querySelector('[data-akt="start"]');
  if (startBtn) startBtn.onclick = () => starteRunde(baueRunde(), zeigeStart);
  app.querySelectorAll("[data-thema]").forEach(b => b.onclick = () => zeigeThema(b.dataset.thema));
}

function kartenInhalt(karte) {
  const thema = THEMEN.find(t => t.id === karte.thema);
  const gefragt = daten.fragen.includes(karte.id);
  const ohneGfx = karte.interaktiv && karte.interaktiv.startsWith("finder");
  const uebungsBlock = karte.interaktiv
    ? `<div class="uebung">
        <div class="u-titel">🖐 Jetzt du – probier es hier im Übungsfeld:</div>
        <p class="spiel-anweisung" id="spielanweisung"></p>
        <div id="spielhost"></div>
        <div id="spielfeedback" class="spiel-feedback" hidden></div>
      </div>`
    : `<div class="uebung">
        <div class="u-titel">🖐 Jetzt du – probiere es gleich aus:</div>
        <p>${karte.uebung}</p>
      </div>`;
  return `
    <span class="chip">${thema.emoji} ${thema.name}</span>
    <h2>${karte.titel}</h2>
    ${ohneGfx ? "" : `<div class="gfx">${GRAFIKEN[karte.gfx]()}</div>`}
    ${karte.text.map(a => `<p>${a}</p>`).join("")}
    ${uebungsBlock}
    <details class="hilfe">
      <summary>💡 Mehr Hilfe zu diesem Thema</summary>
      <div class="hilfe-inhalt"><ul>${karte.hilfe.map(h => `<li>${h}</li>`).join("")}</ul></div>
    </details>
    <div class="frage-zeile">
      <button data-akt="frage" class="${gefragt ? "markiert" : ""}">${gefragt ? "✓ Für Julien gemerkt – ihr schaut es zusammen an" : "🤔 Das möchte ich Julien fragen"}</button>
    </div>
    <div id="spielausgang"></div>`;
}

function frageUmschalten(karte, btn) {
  const i = daten.fragen.indexOf(karte.id);
  if (i >= 0) daten.fragen.splice(i, 1); else daten.fragen.push(karte.id);
  speichern();
  const an = daten.fragen.includes(karte.id);
  btn.textContent = an ? "✓ Für Julien gemerkt – ihr schaut es zusammen an" : "🤔 Das möchte ich Julien fragen";
  btn.classList.toggle("markiert", an);
}

function zeigeKarte() {
  aufStartseite = false;
  if (rundePos >= runde.length) { zeigeFertig(); return; }
  const karte = runde[rundePos];
  const pct = Math.round((rundePos / rundeGesamt) * 100);

  const wiederholung = !!daten.karten[karte.id];
  app.innerHTML = `
    <div class="session-kopf">
      <span class="zaehler">${rundeTitel ? esc(rundeTitel) + ": " : ""}Karte ${Math.min(rundePos + 1, rundeGesamt)} von ${rundeGesamt}</span>
      <div class="fortschritt-leiste"><div style="width:${pct}%"></div></div>
      <button class="pause" data-akt="pause">Pause</button>
    </div>
    <div class="karte-box">
      ${kartenInhalt(karte)}
      ${karte.interaktiv ? "" : `
      <div class="bewertung">
        <button class="b-nochmal" data-urteil="nochmal"><span class="emo">😅</span>Zeig's mir<br>gleich nochmal</button>
        <button class="b-geht" data-urteil="geht"><span class="emo">🙂</span>Geht so –<br>morgen wieder</button>
        <button class="b-kann" data-urteil="kann"><span class="emo">😄</span>Kann ich!<span class="k-sub">${abstandText(vorschau(karte.id, "kann").tage)} wieder</span></button>
      </div>
      <div class="sr-hinweis">🔁 Jede Karte kommt wieder – erst morgen, dann in 2 Tagen, 4 Tagen, einer Woche … immer seltener, bis sie sicher sitzt.</div>`}
      <div class="mini-zeile"><button class="btn-mini" data-akt="kannich">Das kann ich schon – nicht mehr wiederholen</button></div>
      <div id="kannich-echo"></div>
    </div>`;
  window.scrollTo(0, 0);

  app.querySelector('[data-akt="pause"]').onclick = () => rundeZurueck();
  app.querySelector('[data-akt="frage"]').onclick = e => frageUmschalten(karte, e.target);
  const weiter = urteil => {
    bewerte(karte.id, urteil);
    if (urteil === "nochmal") {
      runde.push(karte);          // kommt am Ende der Runde noch einmal
      rundeGesamt = runde.length;
    }
    rundePos++;
    zeigeKarte();
  };
  /* Kleiner Knopf mit Rückfrage: Karte ganz aus dem täglichen Üben nehmen. */
  const echo = app.querySelector("#kannich-echo");
  app.querySelector('[data-akt="kannich"]').onclick = () => {
    echo.innerHTML = `<div class="fertig-hinweis">
      <strong>Sicher?</strong><br>Dann kommt „${karte.titel}“ nicht mehr im täglichen Üben vor – nur noch ganz selten zur Auffrischung. Im Thema kannst du das jederzeit rückgängig machen.
      <div style="display:flex; gap:0.6rem; margin-top:0.8rem">
        <button class="btn-zart" data-akt="kann-ja">Ja, kann ich schon</button>
        <button class="btn-zart" data-akt="kann-nein">Nein, doch üben</button>
      </div></div>`;
    echo.scrollIntoView({ behavior: "smooth", block: "nearest" });
    echo.querySelector('[data-akt="kann-ja"]').onclick = () => {
      alsKannMarkieren(karte.id);
      rundePos++;
      zeigeKarte();
    };
    echo.querySelector('[data-akt="kann-nein"]').onclick = () => { echo.innerHTML = ""; };
  };

  if (karte.interaktiv) {
    starteUebung(karte, { modus: "lernen", wiederholung, weiter });
  } else {
    app.querySelectorAll("[data-urteil]").forEach(b => b.onclick = () => weiter(b.dataset.urteil));
  }
}

function zeigeFertig() {
  aufStartseite = false;
  const heute = heuteISO();
  if (!daten.tage.includes(heute)) { daten.tage.push(heute); speichern(); }
  const streak = streakZaehlen();
  const themenRunde = !!rundeTitel;
  const offen = baueRunde().length;
  app.innerHTML = `
    <div class="karte-box fertig-box">
      <div class="gross-emoji">🌟</div>
      <h2>${themenRunde ? `Geschafft – ${esc(rundeTitel)} durch!` : "Geschafft – fertig für heute!"}</h2>
      <p style="margin-top:0.5rem">Du hast ${rundeGesamt} ${rundeGesamt === 1 ? "Karte" : "Karten"} geübt.</p>
      ${streak >= 2 ? `<div class="streak">🔥 ${streak} Tage hintereinander!</div>` : ""}
      <p style="margin-top:1rem">${themenRunde
        ? `Alles davon ist jetzt im Wiederholungs-Rhythmus – die Karten kommen von allein wieder.${offen ? ` Für heute warten außerdem noch ${offen} ${offen === 1 ? "Karte" : "Karten"} auf der Startseite.` : ""}`
        : "Morgen warten die nächsten Wiederholungen auf dich. Bis dann!"}</p>
      ${themenRunde ? `<button class="btn-gross" style="margin-top:1.2rem" data-akt="zurueck">Zurück zum Thema</button>` : ""}
      <button class="${themenRunde ? "btn-zart" : "btn-gross"}" style="margin-top:${themenRunde ? "0.6rem" : "1.2rem"}" data-akt="heim">Zur Startseite</button>
    </div>`;
  const zurueckBtn = app.querySelector('[data-akt="zurueck"]');
  if (zurueckBtn) zurueckBtn.onclick = () => rundeZurueck();
  app.querySelector('[data-akt="heim"]').onclick = zeigeStart;
}

function zeigeThema(themaId) {
  aufStartseite = false;
  const thema = THEMEN.find(t => t.id === themaId);
  const karten = KARTEN.filter(k => k.thema === themaId);
  app.innerHTML = `
    <div class="zurueck-leiste"><button data-akt="heim">← Zurück zur Startseite</button></div>
    <h2>${thema.emoji} ${thema.name}</h2>
    <p style="color:var(--grey); font-size:0.95rem; margin:0.3rem 0 1rem">Übe das ganze Thema am Stück – oder klicke unten eine einzelne Karte an.</p>
    <button class="btn-gross" data-akt="thema-ueben">▶ &nbsp;Jetzt ${thema.name} üben &nbsp;·&nbsp; ${karten.length} ${karten.length === 1 ? "Karte" : "Karten"}</button>
    <p style="color:var(--grey); font-size:0.85rem; margin:0.6rem 0 1.4rem; text-align:center">Das geht jederzeit zusätzlich – auch wenn für heute schon alles erledigt ist.</p>
    <div class="karten-liste">
      ${karten.map(k => {
        const s = kartenStatus(k.id);
        const d = daten.karten[k.id];
        const txt = d && d.uebersprungen ? "✓ kann ich schon" : statusText(s);
        return `<button data-karte="${k.id}"><span>${k.titel}</span><span class="status s-${s}">${txt}</span></button>`;
      }).join("")}
    </div>`;
  app.querySelector('[data-akt="heim"]').onclick = zeigeStart;
  app.querySelector('[data-akt="thema-ueben"]').onclick = () =>
    starteRunde(karten, () => zeigeThema(themaId), thema.name);
  app.querySelectorAll("[data-karte]").forEach(b => b.onclick = () => zeigeEinzelkarte(b.dataset.karte, themaId));
}

function zeigeEinzelkarte(kartenId, themaId) {
  aufStartseite = false;
  const karte = KARTEN.find(k => k.id === kartenId);
  const stand = daten.karten[kartenId];
  const uebersprungen = !!(stand && stand.uebersprungen);
  app.innerHTML = `
    <div class="zurueck-leiste"><button data-akt="zurueck">← Zurück zur Themenliste</button></div>
    <div class="karte-box">
      ${kartenInhalt(karte)}
      <div class="einzel-aktionen">
        <button class="btn-gross" data-akt="geuebt">✓ &nbsp;Das habe ich gerade geübt</button>
        <button class="btn-zart" data-akt="zurueck2">Nur angeschaut – zurück</button>
        <div class="mini-zeile">
          <button class="btn-mini" data-akt="kannich">${uebersprungen
            ? "Doch wieder üben – zurück in den Rhythmus"
            : "Das kann ich schon – nicht mehr wiederholen"}</button>
        </div>
      </div>
      <div id="einzel-echo"></div>
    </div>`;
  window.scrollTo(0, 0);
  app.querySelector('[data-akt="frage"]').onclick = e => frageUmschalten(karte, e.target);
  app.querySelectorAll('[data-akt="zurueck"], [data-akt="zurueck2"]').forEach(b => b.onclick = () => zeigeThema(themaId));

  const echo = app.querySelector("#einzel-echo");
  const zeigeEcho = html => {
    echo.innerHTML = `<div class="fertig-hinweis">${html}
      <button class="btn-zart" style="margin-top:0.8rem" data-akt="fertig">Zurück zur Themenliste</button></div>`;
    echo.querySelector('[data-akt="fertig"]').onclick = () => zeigeThema(themaId);
    echo.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  app.querySelector('[data-akt="geuebt"]').onclick = () => {
    bewerte(karte.id, "kann");
    app.querySelector('[data-akt="geuebt"]').disabled = true;
    zeigeEcho(`<strong>Prima – gespeichert!</strong><br>Diese Übung kommt ${abstandText(abstandFuer(daten.karten[karte.id].stufe))} zur Wiederholung wieder.`);
  };

  /* Kleiner Knopf mit Rückfrage – ein einzelner Fehlklick ändert nichts. */
  app.querySelector('[data-akt="kannich"]').onclick = () => {
    if (uebersprungen) {
      wiederAufnehmen(karte.id);
      zeigeEcho(`<strong>Alles klar.</strong><br>Diese Übung ist wieder im normalen Rhythmus und kommt demnächst dran.`);
      return;
    }
    echo.innerHTML = `<div class="fertig-hinweis">
      <strong>Sicher?</strong><br>Dann kommt „${karte.titel}“ nicht mehr im täglichen Üben vor – nur noch ganz selten zur Auffrischung. Du kannst das hier jederzeit wieder ändern.
      <div style="display:flex; gap:0.6rem; margin-top:0.8rem">
        <button class="btn-zart" data-akt="kann-ja">Ja, kann ich schon</button>
        <button class="btn-zart" data-akt="kann-nein">Nein, doch üben</button>
      </div></div>`;
    echo.scrollIntoView({ behavior: "smooth", block: "nearest" });
    echo.querySelector('[data-akt="kann-ja"]').onclick = () => {
      alsKannMarkieren(karte.id);
      zeigeEcho(`<strong>Gemerkt.</strong><br>„${karte.titel}“ kommt nicht mehr im täglichen Üben vor.`);
    };
    echo.querySelector('[data-akt="kann-nein"]').onclick = () => { echo.innerHTML = ""; };
  };

  if (karte.interaktiv) starteUebung(karte, { modus: "ansehen" });
}

function zeigeEinstellungen() {
  aufStartseite = false;
  const fragenKarten = daten.fragen.map(id => KARTEN.find(k => k.id === id)).filter(Boolean);
  app.innerHTML = `
    <div class="zurueck-leiste"><button data-akt="heim">← Zurück zur Startseite</button></div>
    <h2>⚙️ Einstellungen</h2>
    <div class="karte-box einstellungen">
      <label for="e-name">Vorname (für die Begrüßung)</label>
      <input type="text" id="e-name" value="${esc(daten.name || "")}" placeholder="z.B. Heike">
      <label for="e-neu">Neue Themen pro Tag</label>
      <select id="e-neu">
        ${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${daten.neuProTag === n ? "selected" : ""}>${n} ${n === 1 ? "neues Thema" : "neue Themen"}</option>`).join("")}
      </select>
      <div class="klein">Wiederholungen kommen immer dazu – das hier steuert nur, wie viel Neues täglich dazukommt.</div>

      <div class="block">
        <label>Fragen an Julien</label>
        ${fragenKarten.length
          ? `<ul class="fragen-liste">${fragenKarten.map(k => `<li>${k.titel}</li>`).join("")}</ul>
             <div class="klein">Diese Themen wurden mit „Das möchte ich Julien fragen“ markiert.</div>`
          : `<div class="klein">Noch keine – Fragen lassen sich auf jeder Karte unten markieren.</div>`}
      </div>

      <div class="block">
        <label>Für Julien: Speicherstand sichern</label>
        <button class="btn-zart" data-akt="export" style="margin-bottom:0.5rem">⬇ Sicherung herunterladen</button>
        <button class="btn-zart" data-akt="import">⬆ Sicherung einspielen</button>
        <input type="file" id="e-datei" accept=".json" style="display:none">
        <div class="klein">Der Lernstand liegt im Browser dieses Macs. Die Sicherung ist eine kleine Datei zum Aufheben oder Umziehen.</div>
      </div>

      <div class="block" id="reset-block">
        <button class="btn-zart" data-akt="reset" style="color:var(--red); border-color:#E8C4BD">Alles zurücksetzen …</button>
      </div>
    </div>`;

  app.querySelector('[data-akt="heim"]').onclick = () => {
    daten.name = app.querySelector("#e-name").value.trim();
    daten.neuProTag = parseInt(app.querySelector("#e-neu").value, 10);
    speichern();
    zeigeStart();
  };
  app.querySelector('[data-akt="export"]').onclick = () => {
    daten.name = app.querySelector("#e-name").value.trim();
    speichern();
    const blob = new Blob([JSON.stringify(daten, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `mac-coach-sicherung-${heuteISO()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  app.querySelector('[data-akt="import"]').onclick = () => app.querySelector("#e-datei").click();
  app.querySelector("#e-datei").onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const leser = new FileReader();
    leser.onload = () => {
      try {
        const neu = JSON.parse(leser.result);
        if (!neu || typeof neu.karten !== "object") throw new Error("format");
        daten = { version: 1, name: "", neuProTag: 3, karten: {}, tage: [], fragen: [], ...neu };
        speichern();
        zeigeEinstellungen();
      } catch (err) {
        alert("Diese Datei ist leider keine Mac-Coach-Sicherung.");
      }
    };
    leser.readAsText(f);
  };
  app.querySelector('[data-akt="reset"]').onclick = () => {
    const block = app.querySelector("#reset-block");
    block.innerHTML = `
      <label style="color:var(--red)">Wirklich den ganzen Lernstand löschen?</label>
      <div style="display:flex; gap:0.6rem; margin-top:0.4rem">
        <button class="btn-zart" data-akt="reset-ja" style="color:var(--red); border-color:#E8C4BD">Ja, alles löschen</button>
        <button class="btn-zart" data-akt="reset-nein">Nein, behalten</button>
      </div>`;
    block.querySelector('[data-akt="reset-ja"]').onclick = () => {
      daten = { version: 1, name: daten.name, neuProTag: 3, karten: {}, tage: [], fragen: [] };
      speichern();
      zeigeEinstellungen();
    };
    block.querySelector('[data-akt="reset-nein"]').onclick = zeigeEinstellungen;
  };
}

zeigeStart();
pruefeUpdate();
</script>
</body>
</html>
